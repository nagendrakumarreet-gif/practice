name: Azure Login Test

on:
  workflow_dispatch:

jobs:
  azure-login:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Verify Azure Connection
        run: |
          echo "Checking Azure connection..."
          az account show

      - name: List Resource Groups
        run: |
          az group list --output table
