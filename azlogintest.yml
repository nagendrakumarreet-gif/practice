name: Azure Connectivity Test

on:
  workflow_dispatch:

jobs:
  azure-connectivity:
    runs-on: ubuntu-latest

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Check Azure Account
        run: az account show

      - name: List Resource Groups
        run: az group list --output table
